# ---------------------------------------------------------------------------
# docker-compose for the subliminal-learning thesis pipeline.
#
# Workflow on the target machine (run by the supervisor):
#   1. git clone <repo>  &&  cd <repo>
#   2. cp .env.example .env   &&   edit .env  (set HF_TOKEN and MODEL_ID)
#   3. docker compose up -d --build         # builds image, starts idle container
#   4. ./launch.sh <stage> [args]           # starts a job under nohup (see launch.sh)
#      OR: docker compose exec thesis ./run.sh <stage>
#
# The container stays alive (sleep infinity) so long-running jobs survive the
# supervisor logging out. Logs and outputs land in bind-mounted host folders
# so results can be collected without entering the container.
# ---------------------------------------------------------------------------
services:
  thesis:
    build:
      context: .
      dockerfile: Dockerfile
    image: subliminal-thesis:latest
    container_name: subliminal-thesis
    restart: "no"

    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/root/.cache/huggingface
      # so scripts can `from _common.vllm_client import VLLMClient`
      - PYTHONPATH=/app/scripts
      # where the inference scripts reach the vLLM server (see the vllm service)
      - VLLM_URL=http://vllm:8000
      - VLLM_BASE_MODEL=teacher-base
      # HF_TOKEN and MODEL_ID come from .env

    volumes:
      # --- persistent HF cache so 70B weights download ONCE and survive rebuilds
      - hf_cache:/root/.cache/huggingface
      # --- the per-trait scripts, bind-mounted so (a) code changes need no
      #     rebuild after `git pull`, and (b) any artifacts your scripts write
      #     NEXT TO THEMSELVES (adapters, checkpoints via WORK_DIR=dirname(__file__))
      #     land on the host and survive container restarts. See .gitignore.
      - ./scripts:/app/scripts
      # --- project data / datasets (put the tweet files + corpora here)
      - ./storage:/app/storage
      # --- results the supervisor will send back: written from inside, read on host
      - ./outputs:/app/outputs
      - ./logs:/app/logs

    # Expose ALL GPUs to the container; accelerate/device_map shards a 70B
    # across whatever is present. (Mirrors the pattern from the reference
    # RAG compose file, applied to our workload.)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Keep the container running so nohup'd jobs outlive an SSH session.
    command: sleep infinity

    # Optional: raise shared memory for dataloaders / large batches.
    shm_size: "16gb"

  # --- vLLM inference server (dynamic LoRA) --------------------------------
  # Serves the base teacher model ONCE and hot-loads freshly-trained LoRA
  # adapters by path (no merge / no GGUF). Used by the inference steps
  # (generate / filter / baseline / evaluate). Training + gradient steps do NOT
  # use this — they run in the `thesis` service on the HF stack.
  #
  # Start it explicitly for inference-heavy stages:
  #     docker compose --profile vllm up -d vllm
  # The thesis container reaches it at http://vllm:8000 (VLLM_URL).
  #
  # A 72B in bf16 (~145 GB) needs BOTH H200s -> tensor-parallel-size 2.
  # Because the pipeline is sequential (train teacher -> generate -> train
  # student), heavy training and vLLM generation do not run at the same time.
  vllm:
    image: vllm/vllm-openai:latest
    container_name: thesis-vllm
    profiles: ["vllm"]
    restart: "no"
    env_file:
      - .env
    environment:
      # allow runtime /v1/load_lora_adapter calls (dynamic adapter loading)
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=True
      - HF_HOME=/root/.cache/huggingface
      # HF_TOKEN + MODEL_ID come from .env
    volumes:
      - hf_cache:/root/.cache/huggingface
      # read the LoRA adapters the thesis container writes under scripts/<trait>/
      - ./scripts:/app/scripts:ro
    ports:
      - "8000:8000"
    ipc: host
    command: >
      --model ${MODEL_ID}
      --served-model-name teacher-base
      --enable-lora
      --max-lora-rank 32
      --tensor-parallel-size 2
      --gpu-memory-utilization 0.90
      --host 0.0.0.0 --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf_cache:
    name: thesis-hf-cache

# ---------------------------------------------------------------------------
# Runtime split:
#   * thesis service  -> HF/transformers/peft stack: fine-tuning + gradients.
#   * vllm service    -> fast batched inference with dynamic LoRA: the teacher
#                        generation, semantic-filter judging, baseline/eval.
# The thesis container talks to vLLM over HTTP at http://vllm:8000 (VLLM_URL,
# set in its environment). vLLM is started on demand with `--profile vllm`.
# ---------------------------------------------------------------------------

